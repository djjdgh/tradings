# ============================================================
# 跨币种动量轮动策略参数
# ============================================================

name: "cross_momentum"
description: "基于 log-price 回归斜率 × R² 的动量轮动"

# 回溯期（天）
lookback_days: 30

# 做多前 N 名
top_n: 3

# R² 最低阈值（过滤不平滑的趋势）
min_r_squared: 0.6

# ATR 参数
atr_period: 14
stop_loss_atr: 3.0
take_profit_atr: 6.0
