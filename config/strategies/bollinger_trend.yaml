# ============================================================
# 布林带趋势突破策略参数
# ============================================================

name: "bollinger_trend"
description: "布林带突破 + 成交量确认 + 多周期趋势过滤"

# 布林带参数
bollinger:
  period: 20              # 布林带周期
  std_dev: 2.0            # 标准差倍数

# 成交量过滤
volume:
  enabled: true
  period: 20              # 成交量均值周期
  threshold: 1.5          # 成交量需大于均量的倍数

# 多周期趋势过滤
trend_filter:
  enabled: true
  ma_period: 50           # 大周期趋势判断均线周期
  # 仅在大周期趋势方向一致时开仓

# 止盈止损
exit:
  atr_period: 14          # ATR 周期
  stop_loss_atr: 2.0      # 固定止损 (ATR 倍数)
  trailing_stop_atr: 1.5  # 追踪止盈 (ATR 倍数)
  max_holding_bars: 48    # 最大持仓K线数（时间止损）
  take_profit_atr: 4.0    # 固定止盈 (ATR 倍数)
