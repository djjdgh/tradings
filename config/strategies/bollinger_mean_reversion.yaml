# 布林带均值回归策略 — 震荡市专用
# 价格触及布林带极端时反向开仓，预期回归中轨

bollinger:
  period: 20
  std_dev: 2.0

rsi:
  period: 14
  overbought: 70
  oversold: 30

adx_filter:
  period: 14
  max_adx: 30          # ADX > 30 时不交易（强趋势不做均值回归）

exit:
  atr_period: 14
  stop_loss_atr: 2.0   # 较宽止损，给回归空间
  take_profit_target: "middle_band"  # TP = 布林带中轨
  max_holding_bars: 36
