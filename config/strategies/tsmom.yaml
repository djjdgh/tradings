# ============================================================
# 多尺度趋势跟踪策略 (TSMOM) 参数
# ============================================================

name: "tsmom"
description: "多尺度 EWMA 趋势跟踪，组合短中长期信号"

# EWMA 时间尺度（天数）
ewma_spans: [8, 16, 32, 64]

# 各尺度信号权重（等权）
signal_weights: [0.25, 0.25, 0.25, 0.25]

# 信号阈值：低于此值不交易（过滤噪音）
signal_threshold: 0.1

# ATR 参数
atr_period: 14
stop_loss_atr: 3.0     # 止损距离（ATR 倍数）
take_profit_atr: 6.0   # 止盈距离（ATR 倍数）
