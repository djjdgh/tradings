# ============================================================
# TSMOM 多尺度趋势跟踪 — 优化参数
# ============================================================

name: "tsmom"
description: "优化版：更严格的信号阈值 + 更宽的止损"

# EWMA 时间尺度
ewma_spans: [8, 16, 32, 64]
signal_weights: [0.25, 0.25, 0.25, 0.25]

# 信号阈值（提高，减少噪音交易）
signal_threshold: 0.25    # 0.1 → 0.25

# ATR 参数（加宽止损）
atr_period: 14
stop_loss_atr: 4.0        # 3.0 → 4.0
take_profit_atr: 8.0      # 6.0 → 8.0
